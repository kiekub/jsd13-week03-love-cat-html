<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
  </head>
  <body>
    <h1>Spotify</h1>
    <p>Sign up</p>
    <form action="" method="get">

    <label>
        Username :
        <input placeholder="Winter" id="cname" type="text" name="cname" required />
    </label>
    <label>
        Password :
        <input placeholder="passw0rd!" id="cpass" type="password" name="cpass" required />
    </label>

    <label> 
        Email :
        <input placeholder="name@domain.com" id="cmail" type="email" name="cmail" required />
    </label>

      <p>Your Plan</p>
      <label>
        Free
        <input type="radio" name="plan" value="free" required />
      </label>
      <label>
        Premium
        <input type="radio" name="plan" value="premium" required />
      </label>

      <br />
      <p>Your Taste</p>
      <label>
        K-pop
        <input type="checkbox" name="ctaste" value="kpop" />
      </label>
      <label>
        Hip-Hop
        <input type="checkbox" name="ctaste" value="hiphop" />
      </label>
      <label>
        Rock
        <input type="checkbox" name="ctaste" value="rock" />
      </label>
      <label>
        EDM
        <input type="checkbox" name="ctaste" value="edm" />
      </label>
      <label>
        R&B
        <input type="checkbox" name="ctaste" value="rb" />
      </label>
      <br />
      <button type="submit">Confirm & Submit</button>
    </form>
  </body>
</html>
